<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certification Wail</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f4f4f4;
    }

    img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: calc(100vh - 48px);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="certifwail.png" alt="Certification de Wail">
</body>
</html>
