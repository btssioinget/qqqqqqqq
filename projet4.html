<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inscription d'un nouveau client</title>
</head>

<body bgcolor="#DDEEFF" text="#003366">

<center>
<h1>Inscription d'un nouveau client</h1>
</center>

<hr color="#4682B4">

<form>
<label>Nom :</label>
<input type="text" name="t1">
<br><br>

<label>Date de naissance :</label>
<input type="date" name="d1">
<br><br>

<label>Age :</label>
<input type="number" name="n1">
<br><br>

<label>Email :</label>
<input type="email" name="email">
<br><br>

<label>Commentaire :</label>
<br>
<textarea cols="30" rows="8" name="commentaire"></textarea>
<br><br>

<label>Mot de passe :</label>
<input type="password" name="p1">
<br><br>

<input type="submit" value="S'inscrire">
<input type="reset" value="Effacer">
</form>

<hr color="#4682B4">

</body>
</html>
